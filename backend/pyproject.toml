[project]
name = "voyanta"
version = "0.1.0"
description = "A LangGraph tour-planner agent exposed over HTTP."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "airportsdata>=20260315",
    "argon2-cffi>=25.1.0",
    "certifi>=2026.7.22",
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langsmith>=0.10.15",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.14.2",
    "pydantic[email]>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "slowapi>=0.1.10",
    "tavily-python>=0.7.27",
    "uvicorn>=0.52.0",
]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a default is how FastAPI declares dependencies, not a mutable default.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
